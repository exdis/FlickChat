name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **FlickChat**: its folder is `FlickChat` and its options are in the game's Options, on the AddOns tab, under FlickChat.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. A screenshot or a short clip helps.
    validations:
      required: true
